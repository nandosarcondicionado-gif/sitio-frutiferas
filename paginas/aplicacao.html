<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Aplicação - Sítio Frutíferas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f8f0; padding: 20px; }
        header { background: #2d7d32; color: white; padding: 15px; text-align: center; border-radius: 8px; position: relative; margin-bottom: 20px; }
        .voltar { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: white; text-decoration: none; }
        .container { max-width: 500px; margin: 0 auto; }
        label { display: block; margin: 12px 0 4px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { background: #2d7d32; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; margin-top: 20px; cursor: pointer; }
        .sucesso { background: #d4edda; color: #155724; padding: 15px; border-radius: 6px; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="voltar">← Voltar</a>
        <h2>📅 Registrar Aplicação</h2>
    </header>
    <div class="container">
        <label>Fruta:</label>
        <select id="fruta">
            <option value="">Selecione...</option>
            <option>Pêssego</option>
            <option>Abacaxi</option>
            <option>Morango</option>
            <option>Limão</option>
            <option>Goiaba</option>
            <option>Lichia</option>
        </select>

        <label>Produto usado:</label>
        <input type="text" id="produto" placeholder="Nome do produto">

        <label>Quantidade usada:</label>
        <input type="text" id="quantidade" placeholder="Ex: 30ml em 20L de água">

        <label>Data:</label>
        <input type="date" id="data">

        <label>Observação:</label>
        <textarea id="obs" rows="3" placeholder="Ex: 1ª aplicação da safra"></textarea>

        <button onclick="salvar()">✅ Salvar Registro</button>

        <div class="sucesso" id="mensagem">
            ✅ Aplicação registrada com sucesso!
        </div>
    </div>

    <script>
        function salvar() {
            const fruta = document.getElementById('fruta').value;
            const produto = document.getElementById('produto').value;
            if (!fruta || !produto) { alert('⚠️ Preencha a fruta e o produto!'); return; }
            
            const registro = {
                fruta,
                produto: document.getElementById('produto').value,
                quantidade: document.getElementById('quantidade').value,
                data: document.getElementById('data').value,
                obs: document.getElementById('obs').value
            };
            
            const historico = JSON.parse(localStorage.getItem('historico') || '[]');
            historico.unshift(registro);
            localStorage.setItem('historico', JSON.stringify(historico));
            
            document.getElementById('mensagem').style.display = 'block';
            setTimeout(() => window.location.href = 'historico.html', 1500);
        }
    </script>
</body>
</html>
